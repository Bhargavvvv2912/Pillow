name: Autonomous Dependency Updater for Pillow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout Experiment Repository
        uses: actions/checkout@v4

      - name: Clone Pillow Repository
        run: git clone https://github.com/python-pillow/Pillow.git

      - name: Install System Dependencies for Pillow Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libtiff5-dev liblcms2-dev libwebp-dev libfreetype6-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pinned Version of Build Tools
        run: |
          python -m pip install --upgrade \
            "pip==23.3.1" \
            "setuptools==68.2.2" \
            "pip-tools==6.13.0" \
            "toml"

      - name: Generate a Complete requirements.in file
        id: generate-req-in
        run: |
          echo "Dynamically resolving Build and Test dependencies from pyproject.toml..."
          python -c "
          import toml; from pathlib import Path
          toml_path = Path('./Pillow/pyproject.toml')
          with open(toml_path, 'r') as f: data = toml.load(f)
          build_deps = data.get('build-system', {}).get('requires', [])
          test_deps = data.get('project', {}).get('optional-dependencies', {}).get('tests', [])
          with open('requirements.in', 'w') as f:
              for dep in build_deps + test_deps: f.write(f'{dep}\n')
          "
          echo "--- Generated requirements.in for build and test tools: ---"
          cat requirements.in
          
      - name: STEP 1: Compile the toolchain dependencies
        id: compile-tools
        run: |
          echo "Compiling the build and test toolchain..."
          pip-compile --resolver=backtracking --output-file=tool-requirements.txt requirements.in
          echo "--- Compiled toolchain requirements: ---"
          cat tool-requirements.txt

      - name: STEP 2: Build the Pillow wheel using the locked toolchain
        id: build-wheel
        run: |
          echo "Building the Pillow wheel in a controlled environment..."
          python -m venv build_venv
          ./build_venv/bin/python -m pip install -r tool-requirements.txt
          ./build_venv/bin/python -m pip wheel -w dist ./Pillow
          WHEEL_FILE=$(ls dist/*.whl)
          echo "Successfully built wheel: $WHEEL_FILE"
          # Pass the ABSOLUTE path of the wheel to the next step
          echo "wheel_path=$(pwd)/$WHEEL_FILE" >> $GITHUB_OUTPUT

      - name: STEP 3: Generate the final requirements file for the agent
        id: generate-final-reqs
        run: |
          echo "Creating the final, unified requirements.txt for the agent..."
          cat tool-requirements.txt > generated-requirements.txt
          echo "${{ steps.build-wheel.outputs.wheel_path }}" >> generated-requirements.txt
          echo "--- Generated the final requirements file for the agent: ---"
          cat generated-requirements.txt

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('generated-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install agent dependencies
        run: pip install google-generativeai pypi-simple packaging

      - name: Clean up temporary build artifacts before running the agent
        run: |
          # This prevents git from seeing leftover build files as changes
          rm -rf build_venv
          rm -rf dist
          rm requirements.in tool-requirements.txt

      - name: Run the Autonomous Agent
        run: python dependency_agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      
      - name: Commit and push changes if any
        run: |
          git config --global user.name 'AURA Dependency Agent'
          git config --global user.email 'aura-agent@users.noreply.github.com'
          
          TARGET_FILE="generated-requirements.txt"
          
          # Add a cleanup step for agent-generated folders to prevent git issues
          rm -rf temp_venv final_venv bootstrap_venv temp_pip_check
          
          git add $TARGET_FILE
          if git diff-index --quiet HEAD; then
            echo "No dependency changes to commit."
            exit 0
          fi
          
          echo "Dependencies have changed. Committing and pushing..."
          COMMIT_BODY="Automated dependency updates for the Pillow library."
          if [ -f metrics_output.txt ]; then
            COMMIT_BODY=$(cat metrics_output.txt)
          fi
          
          git commit -m "chore(deps): Autonomously manage Pillow dependencies [skip ci]" -m "$COMMIT_BODY"
          git push