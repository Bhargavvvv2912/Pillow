name: Autonomous Dependency Updater for Pillow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout Experiment Repository
        uses: actions/checkout@v4

      - name: Clone Pillow Repository
        run: git clone https://github.com/python-pillow/Pillow.git

      - name: Install System Dependencies for Pillow Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libtiff5-dev liblcms2-dev libwebp-dev libfreetype6-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pinned Version of Build Tools
        run: |
          python -m pip install --upgrade \
            "pip==23.3.1" \
            "setuptools==68.2.2" \
            "pip-tools==6.13.0" \
            "toml"

      - name: "STEP 1: Generate a temporary 'ideal state' requirements file"
        id: compile-ideal-state
        run: |
          echo "Generating requirements.in from pyproject.toml..."
          python -c "
          import toml; from pathlib import Path
          toml_path = Path('./Pillow/pyproject.toml')
          with open(toml_path, 'r') as f: data = toml.load(f)
          build_deps = data.get('build-system', {}).get('requires', [])
          test_deps = data.get('project', {}).get('optional-dependencies', {}).get('tests', [])
          with open('requirements.in', 'w') as f:
              f.write('-e ./Pillow\n')
              for dep in build_deps + test_deps: f.write(f'{dep}\n')
          "
          
          echo "Compiling requirements.in to a temporary ideal state file..."
          # This file contains the 'perfect' state with all markers and comments.
          pip-compile --resolver=backtracking --output-file=temp-ideal-state.txt requirements.in

      - name: "STEP 2: Reconcile the Golden Record with the Ideal State"
        id: reconcile-golden-record
        run: |
          # Run your script to intelligently update the long-lived Golden Record.
          python reconcile.py
          
          # We rename the output file to what the agent expects.
          # Note: your reconcile.py saves to 'requirements.txt', so we rename it.
          mv requirements.txt generated-requirements.txt

          echo "--- The reconciled and cleaned Golden Record is now ready for the agent: ---"
          cat generated-requirements.txt
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('generated-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install agent dependencies
        run: pip install google-generativeai pypi-simple packaging

      - name: Clean up temporary build artifacts
        run: |
          # Clean up the files that are no longer needed before the agent runs.
          rm -rf requirements.in
          rm -rf temp-ideal-state.txt

      - name: Run the Autonomous Agent
        run: python dependency_agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      
      - name: Commit and push changes if any
        run: |
          git config --global user.name 'AURA Dependency Agent'
          git config --global user.email 'aura-agent@users.noreply.github.com'
          
          TARGET_FILE="generated-requirements.txt"
          
          # Clean up agent's temporary directories
          rm -rf temp_venv final_venv bootstrap_venv temp_pip_check
          
          git add $TARGET_FILE
          if git diff-index --quiet HEAD; then
            echo "No dependency changes to commit."
            exit 0
          fi
          
          echo "Dependencies have changed. Committing and pushing..."
          git commit -m "chore(deps): Autonomously manage Pillow dependencies [skip ci]"
          git push